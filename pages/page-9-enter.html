<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside the House</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            position: relative;
            font-family: Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Immagine al Centro */
        .inside-picture {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 60vw;
            max-height: 70vh;
            display: block;
            object-fit: contain;
        }

        /* Link in Basso a Destra */
        .nav-link {
            position: fixed;
            bottom: 40px;
            right: 40px;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: underline;
            text-underline-offset: 6px;
            transition: opacity 0.2s ease;
        }

        .nav-link:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- Immagine insidecasa al centro -->
    <img src="../insidecasa.png" alt="Inside House" class="inside-picture">

    <!-- Link in basso a destra -->
    <a href="page-10-connected-paths.html" class="nav-link">REST A BIT AND THEN LEAVE</a>

</body>
</html>
