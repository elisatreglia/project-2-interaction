<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected Paths</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            position: relative;
            font-family: Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Testo in Alto al Centro */
        .title-top {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            max-width: 80%;
        }

        /* Immagine al Centro */
        .main-picture {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 55vw;
            max-height: 60vh;
            display: block;
            object-fit: contain;
        }

        /* Immagine Cliccabile Dito in Basso a Destra */
        .nav-link-img {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: inline-block;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .nav-link-img img {
            max-width: 150px;
            height: auto;
            display: block;
        }

        .nav-link-img:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Testo centrato in alto -->
    <h1 class="title-top">You discover that the stranger knows what you came looking for.</h1>

    <!-- Immagine centrale -->
    <img src="../page-10.png" alt="Connected Paths" class="main-picture">

    <!-- Immagine cliccabile dito in basso a destra -->
    <a href="page-11.html" class="nav-link-img">
        <img src="../dito.png" alt="Next">
    </a>

</body>
</html>
