<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portkey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            position: relative;
            font-family: Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Titolo in Alto al Centro */
        .title-top {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
        }

        /* Immagine Passaporta al Centro */
        .passaporta-picture {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 50vw;
            max-height: 60vh;
            display: block;
            object-fit: contain;
        }

        /* Link in Basso a Destra */
        .nav-link {
            position: fixed;
            bottom: 40px;
            right: 40px;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: underline;
            text-underline-offset: 6px;
            transition: opacity 0.2s ease;
        }

        .nav-link:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- Titolo centrato in alto -->
    <h1 class="title-top">You found the portkey</h1>

    <!-- Immagine passaporta al centro -->
    <img src="../passaporta.png" alt="Portkey" class="passaporta-picture">

    <!-- Link cliccabile in basso a destra -->
    <a href="page-10-connected-paths.html" class="nav-link">USE IT TO TELEPORT</a>

</body>
</html>
