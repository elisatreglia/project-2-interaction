<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Lost Forever</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            position: relative;
            font-family: Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Testo in Alto a Sinistra */
        .text-top-left {
            position: fixed;
            top: 40px;
            left: 40px;
            max-width: 500px;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        /* Immagine in Basso a Sinistra sotto il testo */
        .ending-picture-bottom {
            position: fixed;
            bottom: 40px;
            left: 40px;
            max-width: 45vw;
            max-height: 55vh;
            display: block;
            object-fit: contain;
        }

        /* Opzioni in Basso a Destra allineate alla base dell'immagine */
        .navigation-links {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-start;
        }

        .nav-option {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: underline;
            text-underline-offset: 5px;
            transition: opacity 0.2s ease;
        }

        .nav-option:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- Testo in alto a sinistra -->
    <div class="text-top-left">
        <p>You keep walking, convinced that the exit must be close. But every path looks familiar. The same trees. The same stones. The same silence.</p>
    </div>

    <!-- Immagine in basso a sinistra -->
    <img src="../ending-4.png" alt="Ending 4" class="ending-picture-bottom">

    <!-- Opzioni in basso a destra allineate con l'immagine -->
    <div class="navigation-links">
        <a href="../index.html" class="nav-option">&rarr; Start Over</a>
        <a href="page-6-forest-fork.html" class="nav-option">&rarr; Return to the Forest Fork</a>
    </div>

</body>
</html>
