<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Wish Granted</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            position: relative;
            font-family: Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Immagine a Sinistra */
        .ending-picture {
            position: fixed;
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            max-width: 50vw;
            max-height: 85vh;
            display: block;
            object-fit: contain;
        }

        /* Testo in Alto a Destra */
        .text-top-right {
            position: fixed;
            top: 40px;
            right: 40px;
            max-width: 400px;
            font-size: 1.2rem;
            line-height: 1.6;
            text-align: left;
        }

        /* Dito Cliccabile in Basso a Destra */
        .nav-link-img {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: inline-block;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .nav-link-img img {
            max-width: 150px;
            height: auto;
            display: block;
        }

        .nav-link-img:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Immagine a sinistra -->
    <img src="../ending-1.png" alt="Ending 1" class="ending-picture">

    <!-- Testo in alto a destra -->
    <div class="text-top-right">
        <p>After everything you have been through, you finally find what you came for. The forest has granted your wish. For a moment, everything feels perfect.</p>
    </div>

    <!-- Dito cliccabile in basso a destra -->
    <a href="page-13-wish.html" class="nav-link-img">
        <img src="../dito.png" alt="Next">
    </a>

</body>
</html>
