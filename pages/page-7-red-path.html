<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Path</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            position: relative;
            font-family: Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .content-top-left {
            position: fixed;
            top: 40px;
            left: 40px;
            max-width: 450px;
            z-index: 10;
        }

        .content-top-left p {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-link {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: none;
            text-decoration: underline;
            text-underline-offset: 6px;
            transition: opacity 0.2s ease;
        }

        .option-link:hover {
            opacity: 0.7;
        }

        .persona-picture {
            position: fixed;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            max-width: 65vw;
            max-height: 90vh;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="content-top-left">
        <p>Something follows you:</p>
        <ul class="options-list">
            <li><a href="page-7-run.html" class="option-link">Run</a></li>
            <li><a href="page-7-hide.html" class="option-link">Hide</a></li>
            <li><a href="page-7-turnaround.html" class="option-link">Turn around</a></li>
        </ul>
    </div>

    <img src="../persona.png" alt="Persona" class="persona-picture">

</body>
</html>
