<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Another World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            position: relative;
            font-family: Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Immagine di Sfondo che copre tutto lo schermo */
        .bg-picture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Box Teal in Basso a Destra */
        .teal-box {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background-color: #008080; /* Colore Teal */
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
            z-index: 10;
        }

        .nav-option {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: opacity 0.2s ease;
        }

        .nav-option:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Immagine di Sfondo Citta -->
    <img src="../citta.png" alt="Citta" class="bg-picture">

    <!-- Box Teal con opzioni cliccabili in basso a destra -->
    <div class="teal-box">
        <a href="../index.html" class="nav-option">&rarr; Start Over</a>
        <a href="page-6-forest-fork.html" class="nav-option">&rarr; Return to the Forest Fork</a>
    </div>

</body>
</html>
